  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#8B7355" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/attached_assets/advocate-rohtak_1763319067660.jpg" fetchpriority="high">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"></noscript>
    
    <style id="critical-css">
      /* Critical CSS for above-the-fold content */
      :root {
        --button-outline: rgba(0,0,0, .10);
        --badge-outline: rgba(0,0,0, .05);
        --opaque-button-border-intensity: -8;
        --elevate-1: rgba(0,0,0, .03);
        --elevate-2: rgba(0,0,0, .08);
        --background: 0 0% 100%;
        --foreground: 220 15% 15%;
        --border: 220 10% 91%;
        --card: 0 0% 99%;
        --card-foreground: 220 15% 15%;
        --primary: 221 83% 23%;
        --primary-foreground: 210 40% 98%;
        --secondary: 220 10% 92%;
        --secondary-foreground: 220 15% 15%;
        --muted: 220 10% 92%;
        --muted-foreground: 220 10% 40%;
        --accent: 43 96% 56%;
        --accent-foreground: 220 15% 15%;
        --font-sans: Inter, Open Sans, sans-serif;
        --font-serif: Playfair Display, Georgia, serif;
        --radius: .5rem;
        --primary-border: hsl(var(--primary));
      }
      .dark {
        --button-outline: rgba(255,255,255, .10);
        --badge-outline: rgba(255,255,255, .05);
        --opaque-button-border-intensity: 9;
        --elevate-1: rgba(255,255,255, .04);
        --elevate-2: rgba(255,255,255, .09);
        --background: 220 20% 8%;
        --foreground: 210 40% 96%;
        --border: 220 15% 18%;
        --card: 220 18% 10%;
        --card-foreground: 210 40% 96%;
        --primary: 221 83% 35%;
        --primary-foreground: 210 40% 98%;
        --secondary: 220 15% 18%;
        --secondary-foreground: 210 40% 96%;
        --muted: 220 15% 20%;
        --muted-foreground: 220 10% 65%;
        --accent: 43 96% 56%;
        --accent-foreground: 220 20% 10%;
        --primary-border: hsl(var(--primary));
      }
      *,::before,::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: hsl(var(--border));
      }
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        font-family: var(--font-sans);
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        line-height: inherit;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        max-width: 100vw;
      }
      h1, h2, h3, h4, h5, h6, p {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: inherit;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      .container {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      @media (min-width: 640px) {
        .container {
          max-width: 640px;
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }
      }
      @media (min-width: 768px) {
        .container {
          max-width: 768px;
        }
      }
      @media (min-width: 1024px) {
        .container {
          max-width: 1024px;
          padding-left: 2rem;
          padding-right: 2rem;
        }
      }
      @media (min-width: 1280px) {
        .container {
          max-width: 1280px;
        }
      }
      .flex {
        display: flex;
      }
      .hidden {
        display: none;
      }
      .items-center {
        align-items: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .text-primary {
        color: hsl(var(--primary));
      }
      .bg-background {
        background-color: hsl(var(--background));
      }
      .font-serif {
        font-family: var(--font-serif);
      }
      .font-bold {
        font-weight: 700;
      }
      .text-2xl {
        font-size: 1.5rem;
        line-height: 2rem;
      }
      .border-b {
        border-bottom-width: 1px;
      }
      .py-4 {
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
      .px-4 {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .gap-4 {
        gap: 1rem;
      }
      .relative {
        position: relative;
      }
      .z-50 {
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
